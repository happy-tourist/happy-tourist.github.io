name: Deploy Client

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Quasar SPA
        env:
          VITE_COLYSEUS_URL: ${{ vars.VITE_COLYSEUS_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npx quasar build -m spa

      - name: Prepare artifact
        run: |
          # SPA-fallback для GitHub Pages
          cp dist/spa/index.html dist/spa/404.html
          touch dist/spa/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/spa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
